<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected Image</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  /* Password screen */
  #loginBox {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #111;
    text-align: center;
  }
  #loginBox h2 { margin: 0 0 15px; }
  input, button {
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-top: 10px;
  }
  input { width: 220px; text-align: center; }
  button {
    background: #4CAF50;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #45a049; }
  .error { color: #ff4d4d; margin-top: 10px; }

  /* Image content (shown after correct password) */
  #content {
    display: none;
    text-align: center;
    padding: 20px;
  }

  #secretImage {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
  }

  #caption {
    margin-top: 15px;
    font-size: 18px;
    color: #ddd;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<!-- Password screen -->
<div id="loginBox">
  <h2>Enter Password</h2>
  <input type="password" id="password" placeholder="Password" autofocus>
  <button onclick="checkPassword()">Continue</button>
  <div class="error" id="error"></div>
</div>

<!-- Image + caption (hidden until correct password) -->
<div id="content">
  <img id="secretImage"
       src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj3KT0Yq4Z8yNiVG1BBUb31uIFReRBU_4viQ7L1jLFF1U0qs_20GHxApISFln66DAU3hC2ikQaCidr_SVC4xRiXgpTr6l1ukACXciwMhadGQ3cKVNx7GuNsxbyacIGF2McU7RQbqZlyKXvr0DIEbf2eLQZXlKQ_7FdA33AZejs0l639ve7-tTOi0u84Py9j/s1600/1000202893.png"
       alt="Secret Image">
  <div id="caption">NPCH-23-2044 pragyaroot.com</div>
</div>

<script>
  const CORRECT_PASSWORD = "24682468";

  function checkPassword() {
    const input = document.getElementById("password").value;
    if (input === CORRECT_PASSWORD) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("content").style.display = "block";
    } else {
      document.getElementById("error").textContent = "Wrong password!";
    }
  }

  // Press Enter to submit
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") checkPassword();
  });
</script>

</body>
</html>
