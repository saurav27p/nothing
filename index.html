<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Protected Image</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* Login overlay */
  #loginBox {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #111;
    color: #fff;
    z-index: 10;
  }
  #loginBox h2 { margin: 0 0 15px; }
  input, button {
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-top: 10px;
  }
  input { width: 220px; text-align: center; }
  button {
    background: #4CAF50;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #45a049; }
  .error { color: #ff4d4d; margin-top: 10px; }

  /* Fullscreen image */
  #secretImage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;   /* change to 'cover' to fill & crop */
    background: #000;
    display: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="loginBox">
  <h2>Enter Password</h2>
  <input type="password" id="password" placeholder="Password" autofocus>
  <button onclick="checkPassword()">Continue</button>
  <div class="error" id="error"></div>
</div>

<img id="secretImage"
     src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj3KT0Yq4Z8yNiVG1BBUb31uIFReRBU_4viQ7L1jLFF1U0qs_20GHxApISFln66DAU3hC2ikQaCidr_SVC4xRiXgpTr6l1ukACXciwMhadGQ3cKVNx7GuNsxbyacIGF2McU7RQbqZlyKXvr0DIEbf2eLQZXlKQ_7FdA33AZejs0l639ve7-tTOi0u84Py9j/s1600/1000202893.png"
     alt="Secret Image">

<script>
  const CORRECT_PASSWORD = "24682468";

  function checkPassword() {
    const input = document.getElementById("password").value;
    if (input === CORRECT_PASSWORD) {
      document.getElementById("loginBox").style.display = "none";
      const img = document.getElementById("secretImage");
      img.style.display = "block";

      // Trigger real fullscreen (allowed because it's from a button click)
      if (img.requestFullscreen) {
        img.requestFullscreen().catch(() => {});
      } else if (img.webkitRequestFullscreen) {
        img.webkitRequestFullscreen();
      }
    } else {
      document.getElementById("error").textContent = "Wrong password!";
    }
  }

  // Press Enter to submit
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") checkPassword();
  });
</script>

</body>
</html>
